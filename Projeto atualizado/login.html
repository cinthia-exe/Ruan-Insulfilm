<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RUAN INSULFILM - Login</title>

    <!-- Font Awesome - somente CSS -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts - somente CSS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <div class="login-header">

                <a href="index.html" class="logo-link" aria-label="Voltar para a página inicial">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>RUAN INSULFILM</span>
                </a>

                <h1>Login</h1>

                <p>
                    Acesse sua conta no sistema.
                </p>

            </div>


            <form class="login-form" action="#" method="post">

                <div class="form-group">
                    <label for="login">
                        Login <span>*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="login"
                            name="login"
                            placeholder="Digite seu login"
                            minlength="6"
                            maxlength="6"
                            pattern="[A-Za-z]{6}"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <small>
                        Informe seu login de 6 letras.
                    </small>
                </div>


                <div class="form-group">
                    <label for="senha">
                        Senha <span>*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            minlength="8"
                            maxlength="8"
                            pattern="[A-Za-z]{8}"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <small>
                        Informe sua senha de 8 letras.
                    </small>
                </div>


                <button type="submit" class="btn-gold">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    Entrar no Sistema
                </button>


                <div class="login-links">

                    <a href="#" class="forgot-link">
                        Esqueci minha senha
                    </a>

                    <span class="separator"></span>

                    <span class="new-account">
                        Ainda não possui cadastro?
                    </span>

                    <a href="cadastro.html" class="register-link">
                        Criar conta
                    </a>

                </div>

            </form>


            <div class="back-home">
                <a href="index.html">
                    <i class="fa-solid fa-arrow-left"></i>
                    Voltar para a página inicial
                </a>
            </div>

        </section>

    </main>

</body>
</html>
