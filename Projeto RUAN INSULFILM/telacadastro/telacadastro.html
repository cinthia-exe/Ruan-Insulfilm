<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUAN FILM - Cadastro</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="telacadastro.css">
</head>
<body>

    <main class="container my-auto py-4">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-9 col-xl-8">
                <div class="gold-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h2 class="brand-title h1 mb-1">RUAN INSULFILM</h2>
                        <p class="text-secondary small fw-semibold">Cadastro de Usuário no Sistema</p>
                    </div>

                    <form id="registerForm" novalidate>
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label">Nome Completo *</label>
                                <input type="text" class="form-control" id="reg-nome" placeholder="Digite seu nome completo">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Data de Nascimento *</label>
                                <input type="date" class="form-control" id="reg-nascimento">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Sexo *</label>
                                <select class="form-select" id="reg-sexo">
                                    <option value="">Selecione...</option>
                                    <option value="M">Masculino</option>
                                    <option value="F">Feminino</option>
                                    <option value="O">Outro</option>
                                </select>
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Nome Materno *</label>
                                <input type="text" class="form-control" id="reg-nome-materno" placeholder="Nome completo da mãe">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">CPF *</label>
                                <input type="text" class="form-control" id="reg-cpf" placeholder="000.000.000-00">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Celular * <span class="gold-text extra-small">(+55)XX-XXXXXXXX</span></label>
                                <input type="text" class="form-control" id="reg-celular" placeholder="(+55)21-999999999">
                            </div>
                            <div class="col-12 col-md-6">
                                <label class="form-label">Telefone Fixo * <span class="gold-text extra-small">(+55)XX-XXXXXXXX</span></label>
                                <input type="text" class="form-control" id="reg-fixo" placeholder="(+55)21-22223333">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Endereço Completo *</label>
                                <input type="text" class="form-control" id="reg-endereco" placeholder="Rua, Número, Bairro, Cidade - Estado">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Login * <span class="gold-text extra-small">(6 letras)</span></label>
                                <input type="text" class="form-control" id="reg-login" maxlength="6">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Senha * <span class="gold-text extra-small">(8 letras)</span></label>
                                <input type="password" class="form-control" id="reg-senha" maxlength="8">
                            </div>
                            <div class="col-12 col-md-4">
                                <label class="form-label">Confirma Senha *</label>
                                <input type="password" class="form-control" id="reg-confirma-senha" maxlength="8">
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center gap-3 mt-4 pt-3 border-top border-secondary">
                            <a href="login.html" class="btn btn-outline-gold">Ir para Login</a>
                            <button type="submit" class="btn btn-gold">Cadastrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
