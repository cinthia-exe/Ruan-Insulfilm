<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUAN FILM - Login</title>
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="telalogin.css">
</head>
<body class="justify-content-center align-items-center">

    <main class="container my-auto">
        <div class="row justify-content-center align-items-center">
            <div class="col-12 col-md-6 col-lg-5">
                <div class="gold-card p-4 p-md-5">
                    <div class="text-center mb-4">
                        <i class="fa-solid fa-shield-halved fa-3x gold-text mb-3"></i>
                        <h2 class="brand-title h2">RUAN INSULFILM</h2>
                        <p class="text-secondary small fw-semibold">Login de Acesso</p>
                    </div>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label">Login</label>
                            <input type="text" class="form-control" id="login-user" maxlength="6" placeholder="6 letras">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Senha</label>
                            <input type="password" class="form-control" id="login-pass" maxlength="8" placeholder="8 letras">
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-gold">Entrar</button>
                            <a href="cadastro.html" class="btn btn-outline-gold">Criar Conta</a>
                            <a href="index.html" class="text-secondary text-center small mt-2 text-decoration-none">Voltar para a página inicial</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
