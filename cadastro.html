<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RUAN INSULFILM - Cadastro</title>

    <!-- Font Awesome - somente CSS -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts - somente CSS -->
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;800;900&family=Montserrat:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <main class="cadastro-page">

        <section class="cadastro-card">

            <div class="cadastro-header">

                <a href="index.html" class="logo-link" aria-label="Voltar para a página inicial">
                    <i class="fa-solid fa-shield-halved"></i>

                    <span class="brand-name">
                        RUAN INSULFILM
                    </span>
                </a>

                <h1>Cadastro de Usuário no Sistema</h1>

                <p>
                    Preencha os dados abaixo para criar seu cadastro.
                </p>

            </div>


            <form class="cadastro-form" action="#" method="post">

                <!-- Nome -->
                <div class="form-group form-full">
                    <label for="nome">
                        Nome Completo <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        autocomplete="name"
                        required
                    >
                </div>


                <!-- Data de nascimento -->
                <div class="form-group">
                    <label for="data-nascimento">
                        Data de Nascimento <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="data-nascimento"
                        name="data_nascimento"
                        placeholder="dd/mm/aaaa"
                        inputmode="numeric"
                        pattern="[0-9]{2}/[0-9]{2}/[0-9]{4}"
                        maxlength="10"
                        autocomplete="bday"
                        required
                    >
                </div>


                <!-- Sexo -->
                <div class="form-group">
                    <label for="sexo">
                        Sexo <span>*</span>
                    </label>

                    <select
                        id="sexo"
                        name="sexo"
                        required
                    >
                        <option value="" selected disabled>
                            Selecione...
                        </option>

                        <option value="masculino">
                            Masculino
                        </option>

                        <option value="feminino">
                            Feminino
                    </select>
                </div>


                <!-- Nome materno -->
                <div class="form-group form-full">
                    <label for="nome-materno">
                        Nome Materno <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="nome-materno"
                        name="nome_materno"
                        placeholder="Nome completo da mãe"
                        autocomplete="off"
                        required
                    >
                </div>


                <!-- CPF -->
                <div class="form-group">
                    <label for="cpf">
                        CPF <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="cpf"
                        name="cpf"
                        placeholder="000.000.000-00"
                        inputmode="numeric"
                        pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
                        maxlength="14"
                        autocomplete="off"
                        required
                    >
                </div>


                <!-- Celular -->
                <div class="form-group">
                    <label for="celular">
                        Celular <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="celular"
                        name="celular"
                        placeholder="(+55)21-999999999"
                        inputmode="tel"
                        pattern="\(\+55\)[0-9]{2}-[0-9]{9}"
                        maxlength="17"
                        autocomplete="tel"
                        required
                    >
                </div>


                <!-- Telefone fixo -->
                <div class="form-group">
                    <label for="telefone">
                        Telefone Fixo <span>*</span>
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(+55)21-22223333"
                        inputmode="tel"
                        pattern="\(\+55\)[0-9]{2}-[0-9]{8}"
                        maxlength="16"
                        autocomplete="tel"
                        required
                    >
                </div>


                <!-- Endereço -->
                <div class="form-group form-full">
                    <label for="endereco">
                        Endereço Completo <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="endereco"
                        name="endereco"
                        placeholder="Rua, Número, Bairro, Cidade - Estado"
                        autocomplete="street-address"
                        required
                    >
                </div>


                <!-- Login -->
                <div class="form-group">
                    <label for="login">
                        Login <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        placeholder="6 letras"
                        minlength="6"
                        maxlength="6"
                        pattern="[A-Za-z]{6}"
                        autocomplete="username"
                        required
                    >

                    <small>
                        Informe exatamente 6 letras.
                    </small>
                </div>


                <!-- Senha -->
                <div class="form-group">
                    <label for="senha">
                        Senha <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="8 letras"
                        minlength="8"
                        maxlength="8"
                        pattern="[A-Za-z]{8}"
                        autocomplete="new-password"
                        required
                    >

                    <small>
                        Informe exatamente 8 letras.
                    </small>
                </div>


                <!-- Confirmação -->
                <div class="form-group form-full">
                    <label for="confirma-senha">
                        Confirma Senha <span>*</span>
                    </label>

                    <input
                        type="password"
                        id="confirma-senha"
                        name="confirma_senha"
                        placeholder="Digite a senha novamente"
                        minlength="8"
                        maxlength="8"
                        pattern="[A-Za-z]{8}"
                        autocomplete="new-password"
                        required
                    >
                </div>


                <!-- Termo -->
                <div class="form-footer">

                    <a href="index.html" class="btn-secondary">
                        <i class="fa-solid fa-arrow-left"></i>
                        Voltar
                    </a>

                    <button type="submit" class="btn-gold">
                        <i class="fa-solid fa-user-plus"></i>
                        Cadastrar Usuário
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>
</html>
